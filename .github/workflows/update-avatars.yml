# 每月 15 日以 YouTube Data API 更新成員頭像（240px）
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 新增 YOUTUBE_API_KEY
# 取得失敗的成員會保留原本的頭像；只有頭像有變更時才會 commit
name: 更新成員頭像

on:
  schedule:
    - cron: "0 3 15 * *" # 每月 15 日 03:00 UTC（日本時間 12:00）
  workflow_dispatch: # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-avatars
  cancel-in-progress: false

jobs:
  update-avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 下載頭像
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/fetch-avatars.mjs

      - name: Commit 變更的頭像
        run: |
          if [ -z "$(git status --porcelain -- images/avatars)" ]; then
            echo "頭像沒有變更，不需要 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/avatars
          git commit -m "chore: 每月更新成員頭像"
          git push
