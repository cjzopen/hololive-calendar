<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="ホロこよみ（非公式）| hololive calendar">
  <meta property="og:description" content="ホロライブプロダクション所属タレントの誕生日、デビュー日、ライブ・イベント等の情報カレンダー。">

  <meta property="og:url" content="https://cjzopen.github.io/hololive-calendar/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@cjzopen">
  <meta name="twitter:title" content="ホロこよみ（非公式）| hololive calendar">
  <meta name="twitter:description" content="ホロライブプロダクション所属タレントの誕生日、デビュー日、ライブ・イベント等の情報カレンダー。">
  <meta name="twitter:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiS3pLOJKGDo1AAPr8URC2mRj5pWX9kkC6lWqUM9TvrYpwULROqTkWh2sISXKDDrOL_ap27kUlv0jHbE1HZd9EJMQP9n5aVw-JDZd6GTD9aGVJhIpV5przuihb5aOHcIV6AL91wZeQ_AJO4tZlXejXNKOo19-ThfuL1iLtIQ39YNAsjH9fE1iXe-E5hCw/s960/%E6%97%A5%E5%B8%B8.webp">

  <!-- Google Fonts: Dela Gothic One, Fredoka, Zen Maru Gothic, Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HYXNTEXRJ5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HYXNTEXRJ5');
  </script>
</head>
<body>
  <div id="app-layout">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 側邊欄導航 (Sidebar) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge-wrap">
          <div class="brand-logo">✨</div>
          <span class="brand-badge">非公式</span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">ホロこよみ</h1>
          <div class="brand-subtitle">hololive calendar</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-view="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">ホーム</span>
        </button>
        <button type="button" class="nav-item" data-view="calendar">
          <span class="nav-icon">📅</span>
          <span class="nav-label">カレンダー</span>
        </button>
        <button type="button" class="nav-item" data-view="members">
          <span class="nav-icon">👥</span>
          <span class="nav-label">メンバー</span>
        </button>
      </nav>

      <div class="sidebar-member-status" id="sidebar-member-status">
        <!-- 顯示目前選擇的成員，若有選擇成員可一鍵清除 -->
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-deco-dots">
          <span class="dot _pink"></span>
          <span class="dot _cyan"></span>
          <span class="dot _yellow"></span>
        </div>
        <small class="sidebar-copyright">&copy; cjzopen</small>
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- 手機頂部列 (Mobile Topbar) -->
      <header id="mobile-topbar" class="mobile-topbar">
        <button type="button" id="menu-toggle" class="menu-toggle" aria-label="メニューを開く">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="topbar-title">ホロこよみ</div>
        <button type="button" id="quick-today-btn" class="quick-today-btn">今日 ✨</button>
      </header>

      <main id="main-content" class="main-content">
        <!-- ==============================================
             視圖 1: 首頁 (Home View: Today & Upcoming)
             ============================================== -->
        <section id="view-home" class="page-view active">
          <div class="hero-banner">
            <div class="hero-content">
              <div class="hero-tag"><span class="tag-hanko">おでかけ</span> TODAY'S HIGHLIGHT</div>
              <h2 class="hero-title">きょうのホロライブ</h2>
              <p class="hero-desc">ホロメンの誕生日、デビュー日、ライブ情報をお届け！</p>
            </div>
            <div class="hero-date-box" id="hero-date-box"></div>
          </div>

          <!-- 今日有什麼 (Today's Events) -->
          <div class="section-block">
            <div class="section-header">
              <h3 class="section-title"><span class="title-txt">きょうの予定</span></h3>
              <span class="section-sub" id="today-summary-label">読み込み中…</span>
            </div>
            <div id="today-events-container" class="today-events-container"></div>
          </div>

          <!-- 最近有什麼 (Upcoming Events with Countdown) -->
          <div class="section-block">
            <div class="section-header">
              <h3 class="section-title"><span class="title-txt">これからの予定</span></h3>
              <span class="section-sub">記念日・ライブのカウントダウン</span>
            </div>
            <div class="upcoming-filter-bar">
              <button type="button" class="filter-chip active" data-filter="all">すべて</button>
              <button type="button" class="filter-chip" data-filter="birthday">🎂 誕生日</button>
              <button type="button" class="filter-chip" data-filter="debut">📢 デビュー</button>
              <button type="button" class="filter-chip" data-filter="special">✨ スペシャル</button>
            </div>
            <div id="upcoming-events-container" class="upcoming-events-container"></div>
          </div>
        </section>

        <!-- ==============================================
             視圖 2: 完整月曆 (Full Calendar View)
             ============================================== -->
        <section id="view-calendar" class="page-view">
          <div class="calendar-top-bar">
            <div class="calendar-nav-controls">
              <button id="prev-month" type="button" class="nav-arrow-btn" aria-label="前月">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 448 512"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
              </button>
              <div id="month-label" class="calendar-month-label"></div>
              <button id="next-month" type="button" class="nav-arrow-btn" aria-label="翌月">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 448 512"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg>
              </button>
              <button id="today-btn" type="button" class="btn-today">今月 / 今日 🏠</button>
            </div>

            <div class="calendar-toolbar">
              <div id="filter" class="filter-pills">
                <label class="filter-pill">
                  <input type="checkbox" class="filter-checkbox" value="birthday" checked>
                  <span class="pill-label">🎂 誕生日</span>
                </label>
                <label class="filter-pill">
                  <input type="checkbox" class="filter-checkbox" value="debut" checked>
                  <span class="pill-label">📢 デビュー</span>
                </label>
                <label class="filter-pill">
                  <input type="checkbox" class="filter-checkbox" value="special" checked>
                  <span class="pill-label">✨ スペシャル</span>
                </label>
              </div>

              <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 ホロメンを検索…" list="search-datalist" />
                <datalist id="search-datalist"></datalist>
              </div>
            </div>
          </div>

          <!-- 當前成員過濾提示 (若從成員頁過來) -->
          <div id="calendar-member-filter-banner" class="calendar-member-filter-banner u-hidden">
            <span class="filter-desc" id="calendar-member-filter-desc"></span>
            <button type="button" id="calendar-clear-member-btn" class="btn-clear-filter">✕ 全員表示に戻す</button>
          </div>

          <!-- 雙欄手帳佈局 (Master-Detail) -->
          <div class="calendar-layout-container">
            <div class="calendar-main-column">
              <div class="weekday-labels-grid">
                <div class="weekday-header is-sun">日</div>
                <div class="weekday-header">月</div>
                <div class="weekday-header">火</div>
                <div class="weekday-header">水</div>
                <div class="weekday-header">木</div>
                <div class="weekday-header">金</div>
                <div class="weekday-header is-sat">土</div>
              </div>
              <div id="calendar-grid" class="calendar-cards-grid"></div>
            </div>

            <!-- 右側/下方 當日詳細面板 (Day Journal Detail) -->
            <aside class="calendar-detail-panel" id="calendar-day-panel">
              <div class="detail-panel-card">
                <div class="detail-header">
                  <span class="detail-badge">選択中の日付</span>
                  <h3 id="panel-date-title" class="panel-date-title">2026年9月28日</h3>
                </div>
                <div id="panel-events-list" class="panel-events-list"></div>
              </div>
            </aside>
          </div>
        </section>

        <!-- ==============================================
             視圖 3: 成員專屬頁 (Members Directory & Spotlight)
             ============================================== -->
        <section id="view-members" class="page-view">
          <!-- 成員列表子視圖 -->
          <div id="members-list-subview">
            <div class="section-header">
              <h3 class="section-title"><span class="title-txt">メンバー一覧</span></h3>
              <span class="section-sub">メンバーを選択すると、そのメンバー専用画面に切り替わります</span>
            </div>
            <div class="members-search-bar">
              <input type="text" id="members-search-input" placeholder="🔍 名前・推しマーク・IDで検索…" />
            </div>
            <div id="members-grid" class="members-grid"></div>
          </div>

          <!-- 成員個人專屬畫面 (點選成員後此處全螢幕展示) -->
          <div id="member-profile-subview" class="member-profile-subview u-hidden">
            <div class="member-profile-top-nav">
              <button type="button" id="member-back-btn" class="member-back-btn">
                ← メンバー一覧へもどる
              </button>
              <button type="button" id="member-view-calendar-btn" class="member-view-calendar-btn">
                📅 このメンバーのカレンダーを見る
              </button>
            </div>

            <!-- 個人主題 Hero 拍立得卡片 -->
            <div id="member-spotlight-card" class="member-spotlight-card"></div>

            <!-- 該成員活動日程 -->
            <div class="member-timeline-block">
              <div class="timeline-header">
                <h4 class="member-timeline-title">🎪 出演イベント・ライブ一覧</h4>
                <span class="timeline-count" id="member-timeline-count"></span>
              </div>
              <div id="member-events-timeline" class="member-events-timeline"></div>
            </div>
          </div>
        </section>
      </main>

      <footer id="footer" class="site-footer">
        <div class="footer-inner">
          <div class="footer-brand">ホロこよみ · hololive calendar（非公式）</div>
          <small>&copy; cjzopen</small>
        </div>
      </footer>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
